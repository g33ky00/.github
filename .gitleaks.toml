title = "UCQCS Gitleaks Config"

[extend]
useDefault = true

[[rules]]
id = "custom-api-key"
description = "Generic API key pattern"
regex = '''(?i)(api[_-]?key|apikey)\s*[:=]\s*['"][a-zA-Z0-9]{20,}['"]'''
tags = ["key", "api"]

[[rules]]
id = "custom-token"
description = "Generic token pattern"
regex = '''(?i)(token|secret|password)\s*[:=]\s*['"][a-zA-Z0-9+/=]{16,}['"]'''
tags = ["token", "secret"]

[allowlist]
description = "Allowlist for test fixtures, examples, and known public keys"
paths = [
  '''aegis/telemetry/posthog\.py$''',
  '''strix/telemetry/posthog\.py$''',
  '''internal/service/testdata/.*\.pem$''',
  '''uv\.lock$''',
  '''strix/skills/tooling/python\.md$''',
  '''mfa\.php$''',
  '''\.test\.py$''',
  '''test_.*\.py$''',
  '''_test\.go$''',
  '''\.spec\.js$''',
  '''example''',
  '''fixture''',
]
regexes = [
  '''whsec_NsNZNMSnWVPLt8GErz3SVZ97pWu8eb6D''',
]
